[project]
name = "travel-planner"
version = "0.1.0"
description = "LangGraph travel planner microservices system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chroma>=0.2.0",
    "fastapi>=0.116.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "mcp>=1.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv.workspace]
members = [
    "services/agent-service",
    "services/gateway",
    "services/db-service",
    "services/trip-service",
]

[project.scripts]
travel-planner = "main:main"
travel-planner-chat = "app.cli:main"
travel-planner-mcp = "app.services.mcp.server:main"

[tool.ruff]
line-length = 100
target-version = "py312"
