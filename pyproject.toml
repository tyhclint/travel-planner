[project]
name = "travel-planner"
version = "0.1.0"
description = "LangGraph travel planner microservice skeleton"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
travel-planner = "main:main"
travel-planner-chat = "app.cli:main"
travel-planner-mcp = "app.services.mcp.server:main"

[tool.ruff]
line-length = 100
target-version = "py312"
