[project]
name = "travel-planner"
version = "0.1.0"
description = "LangGraph travel planner microservices system"
readme = "README.md"
requires-python = ">=3.12"

[tool.uv.workspace]
members = [
    "services/agent-service",
    "services/gateway",
    "services/db-service",
    "services/trip-service",
]

[tool.ruff]
line-length = 100
target-version = "py312"
